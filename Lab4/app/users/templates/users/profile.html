{% extends 'base.html' %}{% block content %}<header class="section-heading"><span class="eyebrow">LAB 4 / SESSION</span><h1>Профіль <span class="accent">{{ username }}</span></h1></header><section class="panel"><h2>Вхід виконано</h2><p>Ця сторінка доступна після авторизації через Flask session.</p><h2>Тема профілю</h2><p class="muted">Поточне значення cookie: {{ theme }}</p><form method="post" action="{{ url_for('users.change_theme') }}" class="d-flex flex-wrap gap-2"><button class="btn btn-outline-primary" name="theme" value="light">Світла</button><button class="btn btn-accent" name="theme" value="dark">Темна</button></form><div class="mt-4 d-flex flex-wrap gap-3"><a class="btn btn-outline-light" href="{{ url_for('cookies') }}">Керування cookies</a><a class="btn btn-outline-light" href="{{ url_for('users.logout') }}">Вийти</a></div></section>{% endblock %}
