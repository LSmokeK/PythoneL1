{% extends 'base.html' %}{% block content %}<h1>Зареєстровані користувачі</h1><p>Кількість: {{ users|length }}</p>{% if users %}<table class="table table-dark"><thead><tr><th>ID</th><th>Ім’я</th><th>Пошта</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.username }}</td><td>{{ user.email }}</td></tr>{% endfor %}</tbody></table>{% else %}<p>Користувачів немає.</p>{% endif %}{% endblock %}
