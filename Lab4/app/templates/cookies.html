{% extends 'base.html' %}{% block content %}<header class="section-heading"><span class="eyebrow">LAB 4 / COOKIES</span><h1>Керування <span class="accent">cookies</span></h1></header><section class="panel"><h2>Додати cookie</h2><form method="post" class="row g-3"><input type="hidden" name="action" value="add"><div class="col-md-5"><label class="form-label">Назва</label><input class="form-control" name="name" required></div><div class="col-md-5"><label class="form-label">Значення</label><input class="form-control" name="value" required></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-accent w-100">Додати</button></div></form></section><section class="panel"><h2>Збережені cookies</h2><div class="table-responsive"><table class="table"><thead><tr><th>Назва</th><th>Значення</th><th>Дія</th></tr></thead><tbody>{% for name,value in cookies.items() %}<tr><td>{{ name }}</td><td>{{ value }}</td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="name" value="{{ name }}"><button class="btn btn-outline-light btn-sm">Видалити</button></form></td></tr>{% else %}<tr><td colspan="3">Cookies поки немає</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
